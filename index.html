<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Vault 🪄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#4a0f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Vault 🪄">
<style>
:root{--bg:#fdf7fb;--g1:#fff0f6;--g2:#edf0ff;--card:#fffdfe;--ink:#2b2433;--mute:#7a7285;--line:#eadff0;--brand:#7a56c2;
--c-recipe:#f6aaa0;--c-food:#f9d08a;--c-location:#97cdec;--c-sale:#cdb2ee;--c-activity:#a8ddb5;--c-ai:#93dcd8;--c-dating:#f8aecb;--c-sports:#ffbf94;--c-travels:#b0bdf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a1c;--card:#1f2629;--ink:#eceae4;--mute:#97a0a4;--line:#2e373b;--brand:#6fc2a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a1c;--card:#1f2629;--ink:#eceae4;--mute:#97a0a4;--line:#2e373b;--brand:#6fc2a8;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 90% 0%,rgba(240,190,130,.28),transparent 45%) fixed,linear-gradient(160deg,var(--g1),var(--g2)) fixed,var(--bg);min-height:100vh;color:var(--ink);font:16px/1.45 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 80px}
h1{font:700 34px/1.1 Georgia,"Iowan Old Style",serif;margin:8px 0 14px}
.gt{background:linear-gradient(90deg,#ffe0c2,#f7a9b8,#e2b3f2);-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
textarea{resize:vertical;min-height:56px}
.search{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(10px);padding:6px 0;z-index:5}
.search input{margin:0;font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--cc,var(--line));background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--cc,var(--brand));color:#2b2140;border-color:transparent;font-weight:600;box-shadow:0 3px 10px color-mix(in srgb,var(--cc,var(--brand)) 55%,transparent)}
.chip .n{opacity:.6;margin-left:4px;font-size:13px}
details{background:var(--card);border:1px solid var(--line);box-shadow:0 6px 20px rgba(160,130,200,.14);border-radius:20px;padding:4px 14px;margin:6px 0 10px}
summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--brand)}
form{padding-bottom:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.btn{border:0;background:linear-gradient(90deg,#f8d3b0,#f0a6b8);color:#3a0d1a;padding:11px 18px;border-radius:999px;font-weight:700;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10201b}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.item{background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 18%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--cc) 50%,transparent);border-left:7px solid var(--cc);border-radius:20px;padding:13px 16px;margin:12px 0;box-shadow:0 6px 18px color-mix(in srgb,var(--cc) 30%,transparent)}
.item a.t{font-weight:600;color:var(--ink);text-decoration:none;word-break:break-word}
.host{color:var(--mute);font-size:13px;word-break:break-all}
.cat{display:inline-block;background:var(--cc);color:#2b2140;padding:2px 11px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:5px}
.note{margin:6px 0 0;color:var(--mute);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;background:color-mix(in srgb,var(--cc) 30%,transparent);border-radius:999px;padding:2px 7px;color:var(--mute);cursor:pointer}
.acts{display:flex;gap:14px;margin-top:8px}
.acts button{background:none;border:0;color:var(--mute);padding:2px 0;cursor:pointer;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.row{display:flex;gap:10px;align-items:center}
.fav{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center;font-weight:700;color:#2b2140;background:var(--cc);border-radius:13px;box-shadow:0 3px 10px color-mix(in srgb,var(--cc) 45%,transparent)}
.fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:13px;padding:6px}
.main{flex:1;min-width:0}
.rm{flex:none;width:40px;height:40px;border:0;border-radius:50%;font-size:18px;cursor:pointer;background:color-mix(in srgb,var(--cc) 40%,transparent)}
.rm.on{background:var(--cc)}
.note{background:color-mix(in srgb,var(--cc) 20%,transparent);border-radius:12px;padding:8px 12px;color:var(--ink)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.themebtn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:19px;cursor:pointer;padding:0}
#back{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
#catTitle{font:700 24px/1.1 Georgia,serif;margin:0}
.back{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.tile{aspect-ratio:1/1;border:0;border-radius:28px;background:linear-gradient(145deg,var(--cc),color-mix(in srgb,var(--cc) 65%,#fff));color:#3a1426;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--cc) 35%,transparent);transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile .em{font-size:54px;line-height:1}
.tile b{font-size:18px}
.tile .n{font-size:13px;opacity:.75}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;padding:14px;gap:10px}
.tile.wide .em{font-size:28px}
:root[data-theme="light"]{--bg:#fdf7fb;--g1:#fff0f6;--g2:#edf0ff;--card:#fffdfe;--ink:#2b2433;--mute:#7a7285;--line:#eadff0;--brand:#7a56c2;color-scheme:light}
:root[data-theme="light"] .gt{background:linear-gradient(90deg,#d9668f,#8f6bd6,#5a8fd6);-webkit-background-clip:text;background-clip:text}
:root:not([data-theme="light"]) .foot .ghost{color:#f2b9a3;border-color:#a8566a}
.tiles{grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border-radius:20px;gap:3px;padding:4px;min-width:0}
.tile .em{font-size:30px}
.tile b{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{font-size:10.5px}
.tiles{grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border-radius:24px;gap:4px}
.tile .em{font-size:40px}
.tile b{font-size:14px}
.tile .n{font-size:11.5px}
.tile{position:relative}
.tile::after{content:"";position:absolute;top:9%;left:15%;width:28%;height:17%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-32deg);filter:blur(1px);pointer-events:none}
.tile{box-shadow:0 14px 18px -8px rgba(0,0,0,.5),0 6px 12px color-mix(in srgb,var(--cc) 60%,transparent),inset 0 -6px 10px rgba(0,0,0,.08),inset 0 4px 8px rgba(255,255,255,.35)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#251c2e;--g2:#171d30}}
:root[data-theme="dark"]{--g1:#251c2e;--g2:#171d30}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#4a0f1f;--g1:#6b1a30;--g2:#2d1033;--card:#5a1a2c;--ink:#fbeee6;--mute:#dcb8b8;--line:#8a3049;--brand:#f2c6a0;color-scheme:dark}
::placeholder{color:var(--mute);opacity:.85}
</style>
</head>
<body>
<main>
<div class="top"><h1><span class="gt">The Vault</span> 🪄</h1><button class="themebtn" id="theme" type="button" aria-label="Switch between light and dark mode" title="Light / dark mode">☀️</button></div>
<details id="add"><summary id="addTitle">Save a link</summary>
<form id="f" autocomplete="off">
<input id="url" type="url" inputmode="url" placeholder="Paste link" required>
<input id="by" placeholder="Your name (shown to everyone)" hidden>
<input id="title" placeholder="Title (optional)">
<div class="cats" id="catPick"></div>
<input id="tags" placeholder="Keywords (auto-filled from the link, editable)">
<textarea id="note" placeholder="Note (optional)"></textarea>
<button class="btn" id="saveBtn">Save link</button>
<button class="btn ghost" type="button" id="cancel" hidden>Cancel</button>
</form></details>
<div class="search"><input id="q" type="search" placeholder="Search title, link, keywords, notes"></div>
<div id="back" hidden><button class="back" id="backBtn" type="button">‹ Back</button><h2 id="catTitle"></h2></div>
<div class="tiles" id="filters"></div>
<div id="list"></div>
<div class="foot">
<button class="btn ghost" id="exp">Export backup</button>
<button class="btn ghost" id="imp">Import backup</button>
<input type="file" id="file" accept="application/json" hidden>
</div>
</main>
<script>
const CATS={recipe:['🍳 Recipe','--c-recipe'],food:['🍜 Food','--c-food'],location:['📍 Location','--c-location'],sale:['🏷️ Sale','--c-sale'],activity:['🎈 Activity','--c-activity'],ai:['🤖 AI','--c-ai'],sports:['⚽ Sports','--c-sports'],travels:['✈️ Travels','--c-travels']};
const KEY='linkstash.v1';
let items=[],filter='all',pick='recipe',editId=null,touched=false,autoT='',autoTi='',cloud=null;
window.setItems=a=>{items=a;draw()};window.setCloud=c=>{cloud=c};
const $=id=>document.getElementById(id);
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}items.forEach(i=>{if(!CATS[i.cat])i.cat='activity';i.tags=i.tags||[]})}
function save(){if(cloud)return;try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('Could not save in this browser. Use Export backup.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
const NAMES={youtu:'YouTube',youtube:'YouTube',tiktok:'TikTok',instagram:'Instagram',threads:'Threads',facebook:'Facebook',fb:'Facebook',twitter:'X',x:'X',shopee:'Shopee',lazada:'Lazada',google:'Google',pinterest:'Pinterest',reddit:'Reddit',xiaohongshu:'Xiaohongshu',xhslink:'Xiaohongshu',whatsapp:'WhatsApp',telegram:'Telegram',grab:'Grab',tripadvisor:'Tripadvisor'};
function brand(u){const h=host(u).split('.');let b=h.length>1?h[h.length-2]:h[0];if(['co','com','org','net'].includes(b)&&h.length>2)b=h[h.length-3];b=b.toLowerCase();return NAMES[b]||b.charAt(0).toUpperCase()+b.slice(1)}
const BADGES={TikTok:['#111','♪'],Instagram:['linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)','📷'],Threads:['#111','@'],YouTube:['#f00','▶'],Facebook:['#1877f2','f'],X:['#111','𝕏'],Shopee:['#ee4d2d','🛍'],Lazada:['#0f146d','🛒'],Pinterest:['#e60023','P'],Reddit:['#ff4500','👽'],WhatsApp:['#25d366','💬'],Telegram:['#2aabee','✈'],Google:['#4285f4','G'],Grab:['#00b14f','G'],Tripadvisor:['#34e0a1','🦉'],Xiaohongshu:['#ff2442','书']};
function rootHost(u){const h=host(u).split('.');return h.slice(['co','com','org','net'].includes(h[h.length-2])&&h.length>2?-3:-2).join('.')}
function favHTML(u){const b=brand(u),bd=BADGES[b];
 if(bd)return `<span class="fav" title="${esc(b)}" style="background:${bd[0]};color:#fff">${bd[1]}</span>`;
 return `<span class="fav" title="${esc(b)}">${esc(b.charAt(0))}<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(rootHost(u))}&sz=64" alt="" loading="lazy" onerror="this.remove()"></span>`}
function drawPick(){$('catPick').innerHTML=Object.entries(CATS).map(([k,v])=>`<button type="button" class="chip" style="--cc:var(${v[1]})" data-k="${k}" aria-pressed="${k===pick}">${v[0]}</button>`).join('')}
function drawFilters(){
 const cnt=k=>items.filter(i=>k==='all'||i.cat===k).length;
 $('filters').innerHTML=[['all',['✨ All']],...Object.entries(CATS)].map(([k,v])=>`<button class="chip" style="${v[1]?'--cc:var('+v[1]+')':''}" data-k="${k}" aria-pressed="${k===filter}">${v[0]}<span class="n">${cnt(k)}</span></button>`).join('')}
function drawList(){
 const q=$('q').value.trim().toLowerCase();
 const rows=items.filter(i=>(filter==='all'||i.cat===filter)&&(!q||q.split(/\s+/).every(w=>[i.title,i.url,i.note,i.tags.join(' '),CATS[i.cat][0]].join(' ').toLowerCase().includes(w))));
 $('list').innerHTML=rows.length?rows.map(i=>`<div class="item" style="--cc:var(${CATS[i.cat][1]})">
<div class="cat">${CATS[i.cat][0]}</div>
<div class="row">${favHTML(i.url)}<div class="main"><a class="t" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title||brand(i.url))}</a>${i.title?`<div class="host">${esc(brand(i.url))}</div>`:''}</div>${i.note?`<button class="rm" data-r="${i.id}" aria-label="Show remark" title="Remark">📝</button>`:''}</div>
${i.note?`<p class="note" id="n-${i.id}" hidden>${esc(i.note)}</p>`:''}

${i.by?`<div class="host">added by ${esc(i.by)}</div>`:''}${(!cloud||i.mine)?`<div class="acts"><button data-e="${i.id}">Edit</button><button data-d="${i.id}">Delete</button></div>`:''}</div>`).join('')
 :`<div class="empty">${items.length?'No links match. Try another word or category.':'Nothing saved yet. Open “Save a link” and paste your first one.'}</div>`}
function draw(){drawFilters();drawList()}
function reset(){editId=null;touched=false;autoT='';autoTi='';$('f').reset();pick='recipe';drawPick();$('addTitle').textContent='Save a link';$('saveBtn').textContent='Save link';$('cancel').hidden=true}
$('catPick').onclick=e=>{const k=e.target.closest('[data-k]');if(k){pick=k.dataset.k;touched=true;drawPick()}};
$('filters').onclick=e=>{const k=e.target.closest('[data-k]');if(k){filter=k.dataset.k;draw()}};
$('q').oninput=drawList;
$('cancel').onclick=()=>{reset();$('add').open=false};
$('f').onsubmit=e=>{e.preventDefault();
 const o={url:$('url').value.trim(),title:$('title').value.trim(),cat:pick,note:$('note').value.trim(),tags:$('tags').value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean)};
 if(cloud){editId?cloud.update(editId,o):cloud.add(o)}else if(editId){const i=items.find(x=>x.id===editId);Object.assign(i,o)}else items.unshift({id:Date.now().toString(36),added:Date.now(),...o});
 save();reset();$('add').open=false;draw()};
$('list').onclick=e=>{
 const r=e.target.closest('[data-r]');if(r){const n=document.getElementById('n-'+r.dataset.r);n.hidden=!n.hidden;r.classList.toggle('on',!n.hidden);return}
 const t=e.target.closest('[data-t]');if(t){$('q').value=t.dataset.t;drawList();return}
 const d=e.target.closest('[data-d]');if(d&&confirm('Delete this link?')){if(cloud)cloud.del(d.dataset.d);else{items=items.filter(i=>i.id!==d.dataset.d);save();draw()}return}
 const ed=e.target.closest('[data-e]');if(ed){const i=items.find(x=>x.id===ed.dataset.e);editId=i.id;pick=i.cat;touched=true;drawPick();
  $('url').value=i.url;$('title').value=i.title;$('tags').value=i.tags.join(', ');$('note').value=i.note;
  $('addTitle').textContent='Edit link';$('saveBtn').textContent='Save changes';$('cancel').hidden=false;$('add').open=true;window.scrollTo({top:0,behavior:'smooth'})}};
$('exp').onclick=()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(items,null,1));a.download='link-stash-backup.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());const ids=new Set(items.map(i=>i.id));
 const ok=d.filter(i=>i&&i.url&&CATS[i.cat]&&(cloud||!ids.has(i.id)));if(cloud)ok.forEach(i=>cloud.add({url:i.url,title:i.title||'',cat:i.cat,note:i.note||'',tags:i.tags||[]}));else{ok.forEach(i=>items.push({tags:[],note:'',title:'',...i}));save();draw()}}catch(x){alert('That file is not a valid backup.')}};
const STOP=new Set('www com net org html htm php aspx index https http amp utm the and for with how what from your you this that are all new best top'.split(' '));
const GUESS={ai:'ai chatgpt openai gpt claude llm midjourney anthropic gemini',sports:'sport sports football soccer nba fifa match gym running fitness basketball tennis',travels:'travel hotel hotels flight flights trip booking airbnb tripadvisor agoda itinerary',recipe:'recipe recipes cook cooking bake baking ingredients dessert',food:'restaurant restaurants cafe menu food eat dining ubereats foodpanda yelp',sale:'sale deal deals discount coupon promo shopee lazada amazon voucher',location:'maps map place address directions',activity:'event events activities activity workshop class'};
function safeDec(s){try{return decodeURIComponent(s)}catch(e){return s}}
function words(u){let x;try{x=new URL(u)}catch(e){return null}
 const h=x.hostname.replace(/^www[.]/,'').split('.');let parts=[h.length>1?h[h.length-2]:h[0]];
 x.pathname.split('/').forEach(s=>parts.push(safeDec(s)));
 ['q','query','s','search','k'].forEach(k=>{const v=x.searchParams.get(k);if(v)parts.push(v)});
 const out=[];parts.join(' ').toLowerCase().split(/[^\p{L}\p{N}]+/u).forEach(w=>{
  if(w.length>2&&w.length<=20&&!/^[0-9]+$/.test(w)&&!(w.length>8&&/[0-9]/.test(w))&&!STOP.has(w)&&!out.includes(w))out.push(w)});
 return out.slice(0,8)}
function guessTitle(u){try{const segs=new URL(u).pathname.split('/').filter(Boolean);const s=safeDec(segs[segs.length-1]||'');
 const w=s.replace(/[.][a-z0-9]{2,5}$/i,'').split(/[^\p{L}\p{N}]+/u).filter(a=>a&&!/^[0-9]+$/.test(a)&&!(a.length>8&&/[0-9]/.test(a)));
 return w.length>=2?w.map(a=>a[0].toUpperCase()+a.slice(1)).join(' '):''}catch(e){return ''}}
function guessCat(w){for(const k in GUESS){if(GUESS[k].split(' ').some(g=>w.includes(g)))return k}return null}
$('url').addEventListener('input',()=>{const u=$('url').value.trim();if(!/^https?:[/][/].+[.]./.test(u))return;const w=words(u);if(!w)return;
 if(!$('tags').value||$('tags').value===autoT){autoT=w.join(', ');$('tags').value=autoT}
 const t=guessTitle(u);if(t&&(!$('title').value||$('title').value===autoTi)){autoTi=t;$('title').value=t}
 if(!touched){const g=guessCat(w);if(g){pick=g;drawPick()}}});
let view='home',lastView='home';
function readHash(){const h=location.hash.slice(1);view=(CATS[h]||h==='all')?h:'home'}
function drawFilters(){
 const cnt=k=>items.filter(i=>k==='all'||i.cat===k).length;
 const tile=([k,v])=>{const sp=v[0].indexOf(' '),n=cnt(k);return `<button class="tile" style="--cc:var(${v[1]})" data-k="${k}"><span class="em">${v[0].slice(0,sp)}</span><b>${v[0].slice(sp+1)}</b><span class="n">${n} link${n===1?'':'s'}</span></button>`};
 $('filters').innerHTML=Object.entries(CATS).map(tile).join('')}
function draw(){
 readHash();const home=view==='home',q=$('q').value.trim();
 filter=home?'all':view;
 $('back').hidden=home;$('filters').hidden=!home||!!q;$('list').hidden=home&&!q;
 if(!home){$('catTitle').textContent=view==='all'?'✨ All links':CATS[view][0];if(!touched&&!editId&&view!=='all'){pick=view;drawPick()}}
 if(view!==lastView){lastView=view;window.scrollTo(0,0)}
 drawFilters();drawList()}
let AC,popping=false;
$('q').oninput=draw;
$('backBtn').onclick=()=>{location.hash=''};
window.addEventListener('hashchange',draw);
function setTheme(t){document.documentElement.dataset.theme=t;$('theme').textContent=t==='dark'?'☀️':'🌙';const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#4a0f1f':'#fdf7fb';try{localStorage.setItem('vault.theme',t)}catch(e){}}
let savedTheme='dark';try{savedTheme=localStorage.getItem('vault.theme')||'dark'}catch(e){}
$('theme').onclick=()=>{const toLight=document.documentElement.dataset.theme==='dark';if(toLight)magic();try{navigator.vibrate&&navigator.vibrate(10)}catch(x){}setTheme(toLight?'light':'dark')};
let popBuf=null,lastPop=0;
function magic(){try{audioReady();if(!AC)return;const now=AC.currentTime;
 [1046.5,1318.51,1567.98,2093,2637.02].forEach((f,i)=>{const s=now+i*.055,v=.06-i*.006,dur=.35+i*.1;[[1,v],[2,v*.25]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(a,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+dur);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.02)})})}catch(e){}}
function audioReady(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!popBuf){const n=Math.floor(AC.sampleRate*.04),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);popBuf=b}}catch(e){}}
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,audioReady,{once:true,passive:true}));
function burst(el){
 const r=el.getBoundingClientRect(),c=getComputedStyle(el).getPropertyValue('--cc').trim()||'#f7a9b8',x=r.left+r.width/2,y=r.top+r.height/2;
 for(let i=0;i<14;i++){const p=document.createElement('span'),a=Math.PI*2*i/14+Math.random()*.4,d=45+Math.random()*45,sz=6+Math.random()*7;
  p.style.cssText=`position:fixed;left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px;border-radius:50%;background:${i%3?c:'#fff'};pointer-events:none;z-index:99`;
  document.body.appendChild(p);
  p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:340,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>p.remove()}}
function popTile(t){
 if(popping)return;popping=true;lastPop=Date.now();
 const go=()=>{popping=false;location.hash=t.dataset.k};
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){go();return}
 try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
 burst(t);
 t.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.15)',opacity:1,offset:.4},{transform:'scale(0)',opacity:0}],{duration:130,easing:'ease-out',fill:'forwards'});
 setTimeout(go,150)}
$('filters').addEventListener('pointerdown',e=>{const t=e.target.closest('[data-k]');if(t)popTile(t)});
$('filters').onclick=e=>{const t=e.target.closest('[data-k]');if(t&&!popping&&Date.now()-lastPop>800)popTile(t)};
setTheme(savedTheme);
load();drawPick();draw();
// Share target: receive links shared from other apps (Android installed PWA)
try{const p=new URLSearchParams(location.search);let u=p.get('url')||'';
 if(!u){const m=(p.get('text')||'').match(/https?:[/][/][^\s]+/);if(m)u=m[0]}
 if(u){$('url').value=u;$('url').dispatchEvent(new Event('input'));
  if(p.get('title')&&!$('title').value)$('title').value=p.get('title');
  $('add').open=true;history.replaceState(null,'',location.pathname)}}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
